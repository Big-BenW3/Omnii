name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: Program (Rust unit + LiteSVM + digest vectors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana CLI 3.1.15 + Anchor 1.1.2
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.15/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install --git https://github.com/coral-xyz/anchor --tag v1.1.2 anchor-cli --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: anchor build -p concord --ignore-keys
      - name: IDL in client package is up to date
        run: diff -q target/idl/concord.json packages/concord-client/src/idl/concord.json
      - run: cargo test -p concord
      - run: pnpm test:program:svm
      - run: pnpm test:digest

  web:
    name: Web (lint, types, API tests, build, secret scan, E2E fast)
    runs-on: ubuntu-24.04
    env:
      # Test-only values: E2E uses an embedded database and LiveKit from secrets.
      APP_BASE_URL: http://localhost:3100
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      INVITE_HASH_SECRET: ci-invite-secret-0123456789abcdef01234567890
      DATABASE_URL: pglite:.data/ci
      CONCORD_PROGRAM_ID: 85DsSom7cr5hHVZeTB7k3WKKKpFMB2DLUN3c6FbR9861
      MAGICBLOCK_BASE_RPC_URL: https://rpc.magicblock.app/devnet
      MAGICBLOCK_ER_RPC_URL: https://devnet-router.magicblock.app
      MAGICBLOCK_PER_RPC_URL: https://devnet-tee-as.magicblock.app
      MAGICBLOCK_VRF_QUEUE: Cuj97ggrhhidhbu39TijNVqE74xvKJ69gDervRUXAxGh
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard:devnet
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:secrets
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=fast
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/out }
