name: Devnet gates + full flow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_BASE_URL: http://localhost:3100
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
      INVITE_HASH_SECRET: ${{ secrets.CI_INVITE_HASH_SECRET }}
      DATABASE_URL: pglite:.data/ci
      CONCORD_PROGRAM_ID: 85DsSom7cr5hHVZeTB7k3WKKKpFMB2DLUN3c6FbR9861
      MAGICBLOCK_BASE_RPC_URL: https://rpc.magicblock.app/devnet
      MAGICBLOCK_ER_RPC_URL: https://devnet-router.magicblock.app
      MAGICBLOCK_PER_RPC_URL: https://devnet-tee-as.magicblock.app
      MAGICBLOCK_VRF_QUEUE: Cuj97ggrhhidhbu39TijNVqE74xvKJ69gDervRUXAxGh
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Devnet funder key (Devnet-only wallet with a small balance)
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.DEVNET_FUNDER_KEYPAIR }}' > ~/.config/solana/id.json
      - run: pnpm test:devnet
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gates-report, path: tests/devnet/out }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:devnet
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/out }
