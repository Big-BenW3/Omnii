[package]
name = "concord"
version = "0.1.0"
description = "Concord private meeting and vote program (Phase 1 MagicBlock vertical proof)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "concord"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
ephemeral-rollups-sdk = { version = "0.17.3", features = [
    "anchor",
    "access-control",
    "vrf",
] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
