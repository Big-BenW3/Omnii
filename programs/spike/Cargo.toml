[package]
name = "spike"
version = "0.1.0"
description = "Throwaway Phase 1 spike: PER fees, ephemeral voter slots, read isolation. Delete after results are recorded."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "access-control"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
